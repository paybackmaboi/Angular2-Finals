<h1>My Profile</h1>
<p>
    <strong>Name: </strong> {{account.title}} {{account.firstName}} {{account.lastName}}<br />
    <strong>Email: </strong> {{account.email}}<br />
    <strong>Role: </strong> {{account.role}}<br />
    <strong>Status: </strong> <span [class.text-success]="account.status === 'Active'" [class.text-danger]="account.status === 'Inactive'">{{account.status}}</span>
</p>
<p><a routerLink="update">Update Profile</a></p>
