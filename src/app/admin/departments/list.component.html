<h1>DEPARTMENTS</h1>

<div class="card">
    <div class="card-header">
        Departments
        <button routerLink="add" class="btn btn-sm btn-success float-end">
            Add Department
        </button>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Employee Count</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let department of departments">
                        <td>{{department.name}}</td>
                        <td>{{department.description}}</td>
                        <td>{{department.employeeCount}}</td>
                        <td>
                            <button routerLink="edit/{{department.id}}" 
                                    class="btn btn-sm btn-primary me-1">Edit</button>
                            <button (click)="deleteDepartment(department.id)" 
                                    class="btn btn-sm btn-danger"
                                    [disabled]="department.employeeCount > 0">
                                Delete
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="departments.length === 0">
                        <td colspan="4" class="text-center">
                            <span>No departments found</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
