<h1>{{isAddMode ? 'Add' : 'Edit'}} Employee</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
        <label class="form-label">Employee ID</label>
        <input type="text" formControlName="employeeId" class="form-control" [ngClass]="{ 'is-invalid': submitted && form.controls.employeeId.errors }" />
        <div *ngIf="submitted && form.controls.employeeId.errors" class="invalid-feedback">
            <div *ngIf="form.controls.employeeId.errors.required">Employee ID is required</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">User Account</label>
        <select formControlName="userId" class="form-control" [ngClass]="{ 'is-invalid': submitted && form.controls.userId.errors }">
            <option value=""></option>
            <option *ngFor="let user of users" [value]="user.id">{{user.email}}</option>
        </select>
        <div *ngIf="submitted && form.controls.userId.errors" class="invalid-feedback">
            <div *ngIf="form.controls.userId.errors.required">User Account is required</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Position</label>
        <input type="text" formControlName="position" class="form-control" [ngClass]="{ 'is-invalid': submitted && form.controls.position.errors }" />
        <div *ngIf="submitted && form.controls.position.errors" class="invalid-feedback">
            <div *ngIf="form.controls.position.errors.required">Position is required</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Department</label>
        <select formControlName="departmentId" class="form-control" [ngClass]="{ 'is-invalid': submitted && form.controls.departmentId.errors }">
            <option value=""></option>
            <option *ngFor="let dept of departments" [value]="dept.id">{{dept.name}}</option>
        </select>
        <div *ngIf="submitted && form.controls.departmentId.errors" class="invalid-feedback">
            <div *ngIf="form.controls.departmentId.errors.required">Department is required</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Hire Date</label>
        <input type="date" formControlName="hireDate" class="form-control" [ngClass]="{ 'is-invalid': submitted && form.controls.hireDate.errors }" />
        <div *ngIf="submitted && form.controls.hireDate.errors" class="invalid-feedback">
            <div *ngIf="form.controls.hireDate.errors.required">Hire Date is required</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select formControlName="status" class="form-control">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
    </div>
    <div class="mb-3">
        <button [disabled]="loading" class="btn btn-primary">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Save
        </button>
        <a routerLink="/admin/employees" class="btn btn-link">Cancel</a>
    </div>
</form>
